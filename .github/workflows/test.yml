name: Test

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node-version:
          - 22
          - 24
        os:
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Build Test
        run: pnpm run build

      - name: Linter test
        run: pnpm run lint

      - name: Unit test
        run: pnpm run test:widget && pnpm run test:auth && pnpm run test:plugin && pnpm run test:cli && pnpm run test:types
