name: Test

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node-version:
          - 22
          - 24
        os:
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Build Test
        run: pnpm run build

      - name: Linter test
        run: pnpm run lint

      - name: Unit test
        run: pnpm run test:widget && pnpm run test:extensions && pnpm run test:admin && pnpm run test:auth && pnpm run test:plugin && pnpm run test:ai-audit && pnpm run test:cli && pnpm run test:types

  plugin-installation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Plugin startup and full installation across databases
        run: node --test test/plugin/installation.test.js
        env:
          FK_TEST_POSTGRESQL: '{"host":"127.0.0.1","port":5432,"user":"postgres","password":"test"}'
          FK_TEST_MYSQL: '{"host":"127.0.0.1","port":3306,"user":"root","password":"test"}'
